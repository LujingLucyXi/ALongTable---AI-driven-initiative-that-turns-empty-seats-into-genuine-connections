<style>
:root{--bg:#f5f3ef;--paper:#fff;--ink:#242621;--muted:#85867f;--line:#e6e3dc;--gold:#cda84f;--gold-pale:#f8f1df;--green:#64815c;--shadow:0 10px 30px rgba(39,37,29,.06);font-family:'DM Sans','Noto Sans SC',sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1280px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.05em}.brand svg{width:42px;height:34px}.brand small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a7546;background:var(--gold-pale);padding:5px 8px;border-radius:99px;margin-left:4px}.top-right{display:flex;align-items:center;gap:10px}.restaurant-account{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px}.account-dot{width:9px;height:9px;border-radius:50%;background:#6d8c61;box-shadow:0 0 0 3px #edf3e9}.restaurant-account b{display:block;font-size:11px}.restaurant-account small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.lang-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:12px}.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:218px minmax(0,1fr);gap:30px;padding:29px 24px 55px}.side{position:sticky;top:101px;align-self:start}.side-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:#9a988f;margin:0 0 10px 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;text-align:left;padding:12px 13px;border-radius:11px;font-size:13px;color:#65665f}.nav button:hover,.nav button.active{background:#fff;color:#292a24;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.035)}.nav button.active:before{content:'';width:3px;height:16px;background:var(--gold);border-radius:4px;display:inline-block;vertical-align:-3px;margin-right:9px}.side-note{border-top:1px solid var(--line);margin-top:22px;padding:18px 12px;font-size:11px;line-height:1.55;color:var(--muted)}.main{min-width:0}.welcome{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:0 0 25px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#a2843e;font-weight:700;margin:0 0 7px}.welcome h1,.page-title{font-size:29px;letter-spacing:-.04em;line-height:1.18;margin:0}.welcome p{color:var(--muted);font-size:12px;margin:8px 0 0}.solid,.outline,.light-btn{border-radius:999px;padding:11px 17px;font-size:12px;font-weight:700}.solid{background:#252720;color:#fff;border:1px solid #252720}.solid:hover{background:#41433b}.outline{background:#fff;border:1px solid var(--line)}.outline:hover{border-color:var(--gold)}.light-btn{background:#f6f2e8;border:1px solid #eee3c8;color:#7e6731}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 2px 7px rgba(40,38,30,.02)}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:25px;line-height:1.2;font-weight:700;margin:9px 0 5px}.stat-note{font-size:10px;color:#6d8965}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 11px}.section-head h2{font-size:15px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.two-col{grid-template-columns:1.2fr .8fr}.rec-card{background:linear-gradient(130deg,#fffdf8,#fff);border-color:#eadfbe;position:relative;overflow:hidden}.rec-tag{display:inline-flex;align-items:center;gap:6px;background:var(--gold-pale);color:#856b31;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:700}.rec-card h3{font-size:18px;margin:12px 0 6px}.rec-card p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.rec-facts{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.fact{background:#f6f4ef;padding:8px 10px;border-radius:10px;font-size:11px}.fact b{display:block;font-size:13px;margin-top:3px;color:#38392f}.recommend-list{display:grid;gap:10px}.recommend-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px}.recommend-row b{font-size:12px}.recommend-row small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.recommend-row strong{color:#8c7135;font-size:13px}.ai-note{font-size:10px;color:var(--muted);margin-top:13px;line-height:1.5}.toggle-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0eee9}.toggle-card:last-child{border-bottom:0}.toggle-copy b{display:block;font-size:12px}.toggle-copy small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.switch{width:43px;height:25px;border:0;border-radius:99px;background:#d5d4cf;padding:3px;flex:none;transition:.15s}.switch span{display:block;width:19px;height:19px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0002;transition:.15s}.switch.on{background:var(--green)}.switch.on span{transform:translateX(18px)}.order-list{display:grid;gap:9px}.order{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(150px,.8fr) auto;gap:14px;align-items:center;padding:14px 15px}.order-name{font-weight:700;font-size:12px}.order-meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.order-items{font-size:10px;color:#62635d;line-height:1.5}.order-total{text-align:right;font-weight:700;font-size:13px;white-space:nowrap}.status{display:inline-block;font-size:9px;font-weight:700;color:#54734b;background:#edf3e9;padding:5px 8px;border-radius:99px;margin-top:6px}.status.new{background:#f8f0dc;color:#856b31}.page-head{margin:0 0 21px}.page-head h1{font-size:26px;margin:0;letter-spacing:-.035em}.page-head p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}.offer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.offer-card{display:flex;flex-direction:column;min-height:225px}.offer-card h3{font-size:16px;margin:12px 0 4px}.offer-card .offer-time{font-size:12px;color:var(--muted)}.offer-metrics{display:flex;gap:10px;margin:13px 0 16px}.offer-metric{flex:1;border-radius:11px;background:#f7f5f0;padding:10px}.offer-metric span{font-size:9px;color:var(--muted)}.offer-metric b{display:block;font-size:14px;margin-top:4px}.offer-card .solid{margin-top:auto;align-self:start}.pill-row{display:flex;gap:7px;flex-wrap:wrap}.pill{border-radius:99px;background:#f3f1eb;padding:6px 9px;color:#74746e;font-size:10px}.menu-course{margin-bottom:14px}.menu-course h3{font-size:14px;margin:0 0 9px}.menu-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.menu-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;min-width:0}.menu-item.selected{border-color:var(--gold);background:#fffaf0;box-shadow:inset 0 0 0 1px var(--gold)}.check{width:18px;height:18px;border:1px solid #c9c7c0;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:11px}.menu-item.selected .check{background:var(--gold);border-color:var(--gold)}.dish-copy{min-width:0}.dish-copy b{display:block;font-size:11px}.dish-copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.menu-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f8f5ec;border-radius:13px;padding:13px 15px;font-size:11px;margin:13px 0}.menu-summary b{font-size:16px}.control-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.control-card h3{font-size:13px;margin:0 0 5px}.control-card p{font-size:10px;line-height:1.5;color:var(--muted);margin:0 0 14px;min-height:45px}.control-card .switch{margin-top:9px}.form-select,.num-input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;font-size:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#252720;color:white;border-radius:99px;padding:11px 16px;font-size:12px;box-shadow:var(--shadow);z-index:9}.empty{padding:35px 18px;text-align:center;color:var(--muted);font-size:12px}.small{font-size:10px;color:var(--muted)}.footer-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:21px 18px 44px}.side{position:static}.side-label,.side-note{display:none}.nav{display:flex;overflow:auto;padding-bottom:4px}.nav button{white-space:nowrap}.nav button.active:before{display:none}.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.control-grid{grid-template-columns:1fr}.control-card p{min-height:0}.order{grid-template-columns:1fr auto}.order-items{grid-column:1/2}.order-total{grid-column:2;grid-row:1/3}}
@media(max-width:560px){.topbar{height:62px;padding:0 13px}.restaurant-account{padding:6px 8px;gap:7px}.restaurant-account small{font-size:8px}.brand{font-size:16px;gap:6px}.brand svg{width:34px}.brand small{font-size:8px}.layout{padding:16px 13px 35px;gap:16px}.welcome{align-items:start;flex-direction:column}.welcome h1{font-size:25px}.welcome>.solid{width:100%}.stats{gap:8px}.card{padding:14px;border-radius:14px}.stat-value{font-size:22px}.offer-grid,.menu-list{grid-template-columns:1fr}.recommend-row{padding:10px}.order{padding:12px;gap:8px}.order-total{font-size:12px}.section-head{margin-top:19px}.page-head h1{font-size:23px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(()=>{
const restaurants=[
 {en:'Little Juniper',zh:'小杜松',area:'Hayes Valley',areaZh:'教会区',price:36},
 {en:'Good Neighbor',zh:'好邻居',area:'Richmond',areaZh:'列治文区',price:32},
 {en:'Morrow House',zh:'明日餐厅',area:'Mission',areaZh:'米慎区',price:42},
 {en:'Golden Hour',zh:'金色时光',area:'Sunset',areaZh:'日落区',price:30}
];
const menus={
 starter:[['Roasted carrots with labneh','烤胡萝卜佐酸奶酪',1],['Little gem salad','嫩生菜沙拉',1],['Pork & chive dumplings','猪肉韭菜饺',0],['Crispy chicken bites','香脆鸡块',0]],
 main:[['Mushroom rice','野菌烩饭',1],['Lemon roast chicken','柠檬烤鸡',0],['Braised short rib','红酒炖牛小排',0],['Miso glazed cod','味噌银鳕鱼',0]],
 dessert:[['Olive oil cake','橄榄油蛋糕',1],['Mango coconut pudding','芒果椰奶布丁',1]]
};
const demoOrders=[
 {code:'ALT-2481',guest:'Maya Chen',party:2,time:'Tue, Nov 3 · 5:30 PM',seat:'Table 2 · seats 3–4',items:'2-course · Little gem salad, Lemon roast chicken',total:62.40,status:'New'},
 {code:'ALT-2478',guest:'Jordan Lee',party:1,time:'Wed, Nov 4 · 4:45 PM',seat:'Table 1 · seat 6',items:'3-course · Roasted carrots, Miso glazed cod, Olive oil cake',total:41.80,status:'Confirmed'},
 {code:'ALT-2473',guest:'Ari & Sam',party:2,time:'Thu, Nov 5 · 5:00 PM',seat:'Table 1 · seats 1–2',items:'2-course · Little gem salad, Braised short rib',total:68.20,status:'Confirmed'}
];
const state={page:'overview',lang:'zh',restaurant:0,activeOffer:false,discount:18,autoAvailability:true,autoPricing:true,autoTiming:true,selected:{starter:[0,1],main:[1,3],dessert:[0]},toast:''};
const t=(zh,en)=>state.lang==='zh'?zh:en;
const root=document.getElementById('app');
const money=n=>'$'+Number(n).toFixed(2);
const restaurant=()=>restaurants[state.restaurant];
const selectedCount=()=>Object.values(state.selected).reduce((n,a)=>n+a.length,0);
function topbar(){return `<header class="topbar"><div class="brand"><svg viewBox="0 0 84 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2"><circle cx="15" cy="12" r="7"/><circle cx="33" cy="12" r="7"/><circle cx="51" cy="12" r="7"/><circle cx="69" cy="12" r="7"/><circle cx="15" cy="52" r="7"/><circle cx="33" cy="52" r="7"/><circle cx="51" cy="52" r="7"/><circle cx="69" cy="52" r="7" stroke="#cda84f"/></g><path d="M3 32H81" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>ALongTable <small>Partner</small></div><div class="top-right"><div class="restaurant-account"><span class="account-dot"></span><div><b>${restaurant()[state.lang==='zh'?'zh':'en']}</b><small>${t('单店商家账户','Single restaurant account')}</small></div></div><button class="lang-btn" data-action="language">${state.lang==='zh'?'EN':'中文'}</button></div></header>`}
function nav(){const items=[['overview',t('经营概览','Overview')],['offers',t('时段与优惠','Off-peak offers')],['menu',t('套餐菜单','Prix fixe menu')],['orders',t('预付订单','C-end orders')],['controls',t('自动调整','Auto-adjustments')]];return `<aside class="side"><p class="side-label">${t('餐厅工作台','PARTNER STUDIO')}</p><nav class="nav">${items.map(([id,label])=>`<button class="${state.page===id?'active':''}" data-action="page" data-id="${id}">${label}</button>`).join('')}</nav><div class="side-note">${t('AI 建议只会在你确认后发布。自动调整可随时暂停。','AI recommendations publish only after you approve them. Auto-adjustments can be paused at any time.')}</div></aside>`}
function orderCard(o){return `<article class="card order"><div><div class="order-name">${o.guest} · ${o.party} ${t('位客人','guests')}</div><div class="order-meta">${o.code} · ${o.time}<br>${o.seat}</div><span class="status ${o.status==='New'?'new':''}">${o.status==='New'?t('新订单 · 已预付','New · prepaid'):t('已确认 · 已预付','Confirmed · prepaid')}</span></div><div class="order-items">${o.items}</div><div class="order-total">${money(o.total)}</div></article>`}
function toggler(key,label,desc){return `<div class="toggle-card"><div class="toggle-copy"><b>${label}</b><small>${desc}</small></div><button class="switch ${state[key]?'on':''}" aria-pressed="${state[key]}" aria-label="${label}" data-action="toggle" data-key="${key}"><span></span></button></div>`}
function autoPanel(){return `<section class="card"><div class="section-head" style="margin:0 0 4px"><div><h2>${t('自动调整','Auto-adjust')}</h2><p>${t('选择交给 AI 管理的项目','Choose what AI can manage')}</p></div></div>${toggler('autoAvailability',t('可预订数量','Availability'),t('按实际空桌情况更新可订名额','Update bookable seats as availability changes'))}${toggler('autoPricing',t('套餐价格','Pricing'),t('在你设定的折扣范围内调整优惠','Adjust offers within your discount limit'))}${toggler('autoTiming',t('推荐时段','Timing'),t('根据预订速度推荐更合适的时段','Recommend time windows based on booking pace'))}<p class="ai-note">${t('AI 不会更改你的堂食菜单价格。每项调整都会记录在经营台。','AI will not change your dine-in menu prices. Changes are shown in this partner console.')}</p></section>`}
function recommendation(){const r=restaurant(),base=Math.round(r.price*.7),sale=Math.round(base*(1-state.discount/100));return `<article class="card rec-card"><span class="rec-tag">✦ ${t('AI 推荐 · 当前淡时段','AI recommendation · off-peak')}</span><h3>${t('把周二下午变成一场好聚会','Turn Tuesday afternoon into a table gathering')}</h3><p>${t('周二 4:30–6:00 PM 目前预订较少。推荐开放 8 个座位，并提供限时套餐优惠。','Tuesday 4:30–6:00 PM is currently quiet. Open 8 seats with a limited prix fixe offer.')}</p><div class="rec-facts"><div class="fact">${t('建议时段','Suggested time')}<b>${t('周二 · 4:30 PM','Tue · 4:30 PM')}</b></div><div class="fact">${t('建议折扣','Suggested discount')}<b>${state.discount}% off · ${money(sale)} / ${t('人','person')}</b></div><div class="fact">${t('预计成桌率','Projected fill')}<b>+32%</b></div></div><button class="solid" data-action="publishOffer">${state.activeOffer?t('优惠已发布 · 查看订单','Offer live · view orders'):t('发布淡时段优惠','Publish off-peak offer')}</button><p class="ai-note">${t('原套餐价','Regular prix fixe')}: ${money(base)} ${t('每人。发布后会出现在 C 端可加入的餐桌中。','per guest. Once live, this table appears in C-end discovery.')}</p></article>`}
function overview(){return `<main class="main"><section class="welcome"><div><p class="eyebrow">${t('餐厅经营概览','PARTNER OVERVIEW')}</p><h1>${t('晚上好','Good evening')}, ${restaurant()[state.lang==='zh'?'zh':'en']}</h1><p>${t('淡时段推荐、套餐设置与 C 端预付订单，一处管理。','Manage off-peak offers, prix fixe menus, and prepaid C-end orders in one place.')}</p></div><button class="solid" data-action="page" data-id="offers">${t('查看 AI 推荐','View AI recommendations')}</button></section><div class="grid stats"><article class="card"><div class="stat-label">${t('待服务订单','Upcoming orders')}</div><div class="stat-value">${demoOrders.length}</div><div class="stat-note">${t('全部已在线预付','All prepaid online')}</div></article><article class="card"><div class="stat-label">${t('本周开放餐桌','Live tables this week')}</div><div class="stat-value">${state.activeOffer?'4':'3'}</div><div class="stat-note">${t('覆盖 4 个兴趣主题','Across 4 table themes')}</div></article><article class="card"><div class="stat-label">${t('淡时段上座率','Off-peak fill rate')}</div><div class="stat-value">72%</div><div class="stat-note">↑ 14% ${t('较上月','vs last month')}</div></article><article class="card"><div class="stat-label">${t('预付套餐均价','Average prepaid check')}</div><div class="stat-value">$34</div><div class="stat-note">${t('含税与小费','Tax and tip included')}</div></article></div><div class="grid two-col"><div>${recommendation()}<div class="section-head"><div><h2>${t('最近 C 端订单','Recent C-end orders')}</h2><p>${t('来自 ALongTable 预付预订','From prepaid ALongTable reservations')}</p></div><button class="outline" data-action="page" data-id="orders">${t('全部订单','All orders')}</button></div><div class="order-list">${demoOrders.slice(0,2).map(orderCard).join('')}</div></div><div class="grid" style="align-content:start">${autoPanel()}<section class="card"><div class="section-head" style="margin:0 0 12px"><div><h2>${t('套餐菜单','Prix fixe menu')}</h2><p>${selectedCount()} ${t('道已选菜品','selected dishes')}</p></div><button class="outline" data-action="page" data-id="menu">${t('编辑菜单','Edit menu')}</button></div><div class="pill-row">${Object.entries(state.selected).flatMap(([key,ids])=>ids.map(i=>`<span class="pill">${menus[key][i][state.lang==='zh'?1:0]}</span>`)).join('')}</div></section></div></div></main>`}
function offers(){const r=restaurant(),regular=Math.round(r.price*.7);return `<main class="main"><section class="page-head"><p class="eyebrow">${t('AI 淡时段管理','AI OFF-PEAK MANAGEMENT')}</p><h1>${t('把空档变成可预订餐桌','Turn quiet hours into bookable tables')}</h1><p>${t('AI 根据预订需求和时段表现推荐优惠。确认后，C 端客人即可发现并预订。','AI recommends offers from booking demand and time-slot performance. Approve an offer to make it visible to C-end guests.')}</p></section><div class="grid offer-grid"><article class="card offer-card"><span class="rec-tag">✦ ${t('AI 首选','AI pick')}</span><h3>${t('周二晚早场','Tuesday early dinner')}</h3><div class="offer-time">4:30–6:00 PM · ${t('预计需求低','low demand expected')}</div><div class="offer-metrics"><div class="offer-metric"><span>${t('折扣','Discount')}</span><b>${state.discount}%</b></div><div class="offer-metric"><span>${t('套餐优惠价','Offer price')}</span><b>${money(Math.round(regular*(1-state.discount/100)))} / ${t('人','guest')}</b></div><div class="offer-metric"><span>${t('名额','Seats')}</span><b>${state.autoAvailability?'8':'6'}</b></div></div><button class="${state.activeOffer?'light-btn':'solid'}" data-action="publishOffer">${state.activeOffer?t('已发布 · 暂停优惠','Live · pause offer'):t('确认并发布','Approve & publish')}</button></article><article class="card offer-card"><span class="rec-tag">✦ ${t('AI 建议','AI suggestion')}</span><h3>${t('周三下午茶时段','Wednesday late lunch')}</h3><div class="offer-time">3:30–5:00 PM · ${t('预计填满 5/8 座位','projected 5 of 8 seats')}</div><div class="offer-metrics"><div class="offer-metric"><span>${t('建议折扣','Suggested discount')}</span><b>15%</b></div><div class="offer-metric"><span>${t('套餐优惠价','Offer price')}</span><b>${money(Math.round(regular*.85))} / ${t('人','guest')}</b></div><div class="offer-metric"><span>${t('预计成桌率','Projected fill')}</span><b>68%</b></div></div><button class="outline" data-action="useSecond">${t('采用此建议','Use this recommendation')}</button></article></div><div class="section-head"><div><h2>${t('自动调整规则','Auto-adjustment rules')}</h2><p>${t('你可随时暂停单项自动调整','Pause any automatic adjustment at any time')}</p></div></div><div class="grid control-grid"><article class="card control-card"><h3>${t('名额自动调整','Availability')}</h3><p>${t('按可用桌位与已预订座位更新名额。','Adjust bookable seats as tables fill.')}</p>${toggler('autoAvailability',t('开启自动调整','Auto-adjust availability'),t('按空位更新名额','Update open seats'))}</article><article class="card control-card"><h3>${t('价格自动调整','Pricing')}</h3><p>${t('折扣可在 AI 推荐值上下 5% 内浮动。','Discount may vary within 5% of the AI suggestion.')}</p><div class="toggle-card"><div class="toggle-copy"><b>${t('最高折扣','Maximum discount')}</b><small>${t('当前建议','Current recommendation')}: ${state.discount}%</small></div><select class="form-select" data-action="discount"><option value="10" ${state.discount===10?'selected':''}>10%</option><option value="15" ${state.discount===15?'selected':''}>15%</option><option value="18" ${state.discount===18?'selected':''}>18%</option><option value="20" ${state.discount===20?'selected':''}>20%</option><option value="25" ${state.discount===25?'selected':''}>25%</option></select></div>${toggler('autoPricing',t('开启价格调整','Auto-adjust pricing'),t('保持在折扣上限内','Stay within your discount limit'))}</article><article class="card control-card"><h3>${t('时段自动调整','Timing')}</h3><p>${t('需求变化时，自动推荐相邻淡时段。','Suggest nearby quiet windows when demand shifts.')}</p>${toggler('autoTiming',t('开启时段优化','Auto-adjust timing'),t('调整时先通知你','Notify before changing'))}</article></div><p class="footer-note">${t('自动调整仅影响 ALongTable 预付套餐，不会更改餐厅正常营业时间或堂食价格。','Auto-adjustments apply only to ALongTable prepaid offers and never change regular hours or dine-in prices.')}</p></main>`}
function menuBuilder(){return `<main class="main"><section class="page-head"><p class="eyebrow">${t('套餐菜单设置','PRIX FIXE MENU BUILDER')}</p><h1>${t('把店内菜品组合成套餐','Build a set menu from your dishes')}</h1><p>${t('勾选客人可以选择的菜品。C 端客人预订时会选择套餐课程和每道菜。','Choose which dishes guests can select. C-end guests pick their course tier and dish selections when booking.')}</p></section><section class="card"><div class="section-head" style="margin-top:0"><div><h2>${restaurant()[state.lang==='zh'?'zh':'en']} · ${t('ALongTable 专属套餐','ALongTable prix fixe')}</h2><p>${t('菜品更换不改变同一套餐价格','Dish swaps do not change the tier price')}</p></div><button class="outline" data-action="menuReset">${t('恢复推荐','Reset suggestions')}</button></div>${['starter','main','dessert'].map(key=>{let label=t(key==='starter'?'前菜':key==='main'?'主菜':'甜点',key[0].toUpperCase()+key.slice(1));return `<div class="menu-course"><h3>${label}</h3><div class="menu-list">${menus[key].map((item,i)=>{let checked=state.selected[key].includes(i);return `<button class="menu-item ${checked?'selected':''}" aria-pressed="${checked}" data-action="menuItem" data-key="${key}" data-id="${i}"><span class="check">${checked?'✓':''}</span><span class="dish-copy"><b>${item[state.lang==='zh'?1:0]} ${item[2]?'<small class="status">VEG</small>':''}</b><small>${item[state.lang==='zh'?0:1]}</small></span></button>`}).join('')}</div></div>`}).join('')}<div class="menu-summary"><span>${t('已为 C 端客人开放','Available to C-end guests')} · ${selectedCount()} ${t('道可选菜品','dishes selected')}</span><b>${t('1 / 2 / 3','1 / 2 / 3')} ${t('道套餐','course tiers')}</b></div><button class="solid" data-action="saveMenu">${t('保存套餐菜单','Save prix fixe menu')}</button></section></main>`}
function orders(){return `<main class="main"><section class="page-head"><p class="eyebrow">${t('C 端预付订单','C-END PREPAID ORDERS')}</p><h1>${t('来自 ALongTable 预订的订单','Orders from ALongTable bookings')}</h1><p>${t('客人在线选菜并预付；这里可查看人数、套餐选择和到店时间。','Guests select dishes and prepay online. See party size, menu choices, and arrival time here.')}</p></section><div class="section-head"><div><h2>${t('待服务与近期订单','Upcoming and recent orders')}</h2><p>${t('示例订单展示 C 端预付信息如何到达商家端。','Sample C-end prepaid bookings shown in the partner inbox.')}</p></div><span class="rec-tag">${demoOrders.length} ${t('笔预付订单','prepaid orders')}</span></div><div class="order-list">${demoOrders.map(orderCard).join('')}</div><p class="footer-note">${t('顾客选定的套餐菜品会随订单一同发送。此原型使用示例订单；正式站点需要连接共享预订服务。','Selected prix fixe dishes travel with each booking. This prototype uses sample orders; production needs a shared booking service.')}</p></main>`}
function controls(){return `<main class="main"><section class="page-head"><p class="eyebrow">${t('商家控制台','PARTNER CONTROLS')}</p><h1>${t('自动调整偏好','Auto-adjustment preferences')}</h1><p>${t('由你决定 AI 可以管理哪些预订细节。','Choose which booking details AI may manage.')}</p></section><div class="grid control-grid"><article class="card control-card"><h3>${t('可预订名额','Bookable availability')}</h3><p>${t('座位售出后自动减少可订数量；取消时重新开放。','Reduce seats as they book and reopen them after cancellation.')}</p>${toggler('autoAvailability',t('名额自动调整','Auto-adjust availability'),t('保持餐桌名额准确','Keep table availability current'))}</article><article class="card control-card"><h3>${t('套餐折扣','Prix fixe discount')}</h3><p>${t('在低需求时段按建议区间微调折扣。','Adjust discounts within your selected range during quiet periods.')}</p><select class="form-select" data-action="discount"><option value="10" ${state.discount===10?'selected':''}>10%</option><option value="15" ${state.discount===15?'selected':''}>15%</option><option value="18" ${state.discount===18?'selected':''}>18%</option><option value="20" ${state.discount===20?'selected':''}>20%</option><option value="25" ${state.discount===25?'selected':''}>25%</option></select>${toggler('autoPricing',t('价格自动调整','Auto-adjust pricing'),t('不超过设定折扣上限','Stay under the discount cap'))}</article><article class="card control-card"><h3>${t('可预订时段','Bookable timing')}</h3><p>${t('按需求变化推荐相邻时段，并提前提示。','Recommend nearby time windows as demand shifts.')}</p>${toggler('autoTiming',t('时段自动调整','Auto-adjust timing'),t('更改前显示推荐','Review suggestions before changes'))}</article></div><p class="footer-note">${t('当前选择会同步应用于淡时段优惠。','These preferences are reflected in off-peak offers.')}</p></main>`}
function render(){let page=state.page==='overview'?overview():state.page==='offers'?offers():state.page==='menu'?menuBuilder():state.page==='orders'?orders():controls();root.innerHTML=topbar()+`<div class="layout">${nav()}${page}</div>`+(state.toast?`<div class="toast">${state.toast}</div>`:'');}
function act(el){let a=el.dataset.action;if(a==='page'){state.page=el.dataset.id}else if(a==='language'){state.lang=state.lang==='zh'?'en':'zh'}else if(a==='toggle'){let k=el.dataset.key;state[k]=!state[k]}else if(a==='discount'){state.discount=Number(el.value)}else if(a==='publishOffer'){state.activeOffer=!state.activeOffer;state.page='offers';state.toast=state.activeOffer?t('淡时段套餐已开放给 C 端客人','Off-peak offer is now open to C-end guests'):t('淡时段优惠已暂停','Off-peak offer paused');setTimeout(()=>{state.toast='';render()},2200)}else if(a==='useSecond'){state.discount=15;state.toast=t('已采用周三时段建议','Wednesday recommendation selected');setTimeout(()=>{state.toast='';render()},1800)}else if(a==='menuItem'){let key=el.dataset.key,i=Number(el.dataset.id),items=state.selected[key];state.selected[key]=items.includes(i)?items.filter(x=>x!==i):[...items,i];if(!state.selected[key].length)state.selected[key]=[i]}else if(a==='menuReset'){state.selected={starter:[0,1],main:[1,3],dessert:[0]}}else if(a==='saveMenu'){state.toast=t('套餐菜单已保存','Prix fixe menu saved');setTimeout(()=>{state.toast='';render()},1800)}render()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el&&el.dataset.action!=='restaurant'&&el.dataset.action!=='discount')act(el)});
document.addEventListener('change',e=>{let el=e.target.closest('[data-action="discount"]');if(el){state.discount=Number(el.value);render()}});
render();
})();
</script>
</body>
</html>
