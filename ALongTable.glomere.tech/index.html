function optionsFor(key){if(state.restaurant===0){let cafe={starter:[{en:'Hand-drip coffee',zh:'手冲咖啡',veg:1},{en:'Flat white',zh:'馥芮白',veg:1},{en:'Matcha latte',zh:'抹茶拿铁',veg:1},{en:'Yuzu tea',zh:'柚子茶',veg:1}],main:[{en:'Croissant platter',zh:'可颂拼盘',veg:1},{en:'Avocado toast',zh:'牛油果吐司',veg:1},{en:'Eggs Benedict',zh:'班尼迪克蛋',veg:0},{en:'Ham & cheese croissant',zh:'火腿芝士可颂',veg:0}],dessert:[{en:'Basque cheesecake',zh:'巴斯克蛋糕',veg:1},{en:'Lemon tart',zh:'柠檬挞',veg:1}]};return cafe[key]}return dishes[key]}
function selectedMenuItems(){let keys=courseKeys();return {en:keys.map(k=>optionsFor(k)[state.dishes[k]].en),zh:keys.map(k=>optionsFor(k)[state.dishes[k]].zh)}}
function details(){let r=restaurants[state.restaurant],groupTable=state.tables.find(x=>x.id===state.currentTableId),groupDate=groupTable?new Date(groupTable.startsAt):null,slots=groupTable?[[groupDate.toLocaleString(state.lang==='zh'?'zh-CN':'en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),`${groupTable.filled}/${groupTable.maxSeats}`]]:state.lang==='zh'?[['周六 12:30','5/8'],['周六 18:30','3/8'],['周日 15:00','6/8']]:[['Saturday · 12:30 PM','5/8'],['Saturday · 6:30 PM','3/8'],['Sunday · 3:00 PM','6/8']],dishKeys=['starter','main','dessert'],menu=selectedMenuItems()[state.lang];return `<main class="page">${back()}<div class="detail-head"><div class="detail-copy"><p class="eyebrow">${groupTable?`${themeLabel(groupTable.theme)} · `:''}${state.lang==='zh'?r.cuisineZh:r.cuisine} · ${state.lang==='zh'?r.areaZh:r.area}</p><h1 class="title">${pair(r.en,r.zh)}</h1></div></div><section class="bundle-card"><h2 class="bundle-title">ALongTable Menu · ${state.lang==='zh'?'本店专属套餐':'House set menu'}</h2><div class="course-tiers">${[0,1,2].map(i=>`<button class="course-tier ${state.tier===i?'active':''}" data-action="tier" data-id="${i}"><strong>${i+1}</strong><span>${state.lang==='zh'?`${i+1} 道菜`:`${i+1} course${i?'s':''}`}</span></button>`).join('')}</div><div class="course-pickers">${courseKeys().map(key=>{let options=optionsFor(key),label=state.lang==='zh'?({starter:'前菜',main:'主菜',dessert:'甜点'}[key]):key[0].toUpperCase()+key.slice(1);return `<div class="course-picker"><div class="course-picker-title">${label}</div><div class="dish-option-list" role="group" aria-label="${label}">${options.map((d,i)=>{let selected=state.dishes[key]===i;return `<button type="button" class="dish-option ${selected?'selected':''}" aria-pressed="${selected}" data-action="dish" data-key="${key}" data-id="${i}"><span class="dish-radio">${selected?'✓':''}</span><span class="dish-copy"><span class="dish-title">${state.lang==='zh'?d.zh:d.en}</span><span class="dish-secondary">${state.lang==='zh'?d.en:d.zh}</span></span>${d.veg?`<span class="veg">VEG</span>`:''}</button>`}).join('')}</div></div>`}).join('')}</div><div class="bundle-price"><s>${state.lang==='zh'?'门店散点约':'À la carte'} $${doorPrice()}</s><strong>$${packagePrice()}</strong><span>${state.lang==='zh'?'含税含小费 · 到店零加钱':'tax and tip included · nothing extra at the restaurant'}</span></div><div class="bundle-footnote">${state.lang==='zh'?'此套餐不在门店出售，仅通过 ALongTable 预付预订可享。':'This set is exclusive to prepaid ALongTable reservations.'}</div></section><section class="slot-section"><h2 class="slot-title">${state.lang==='zh'?'可选场次':'Available times'} <span class="slot-subtitle">(${state.lang==='zh'?`本桌 ${groupTable?.maxSeats||8} 人 · 桌长带话题引导`:`${groupTable?.maxSeats||8} seats · host-guided conversation`})</span></h2><p class="seat-instruction">${state.lang==='zh'?'选择一个空位继续预订':'Choose an open chair to continue'}</p><div class="slot-list">${slots.map((slot,i)=>{let occupied=takenFor(i),capacity=groupTable?.maxSeats||8,remaining=Math.max(0,capacity-occupied.length);return `<div class="slot-card ${state.slot===i?'active':''}"><button class="slot-select" data-action="slot" data-id="${i}"><span class="slot-card-top"><span>${slot[0]}</span><span class="slot-availability ${remaining<=2?'low':''}">${state.lang==='zh'?`已订 ${slot[1]} · 剩 ${remaining} 席`:`${slot[1]} booked · ${remaining} seats left`}</span></span></button><div class="chair-row">${Array.from({length:groupTable?.maxSeats||8},(_,j)=>{let n=j+1,status=occupied.includes(n)?'booked':state.slot===i&&state.seat===n?'mine':'open';return `<button class="mini-chair ${status}" ${status==='booked'?'disabled':''} aria-pressed="${status==='mine'}" aria-label="${state.lang==='zh'?'座位':'Seat'} ${n} · ${status==='booked'?(state.lang==='zh'?'已订':'booked'):status==='mine'?(state.lang==='zh'?'我的座位':'your seat'):(state.lang==='zh'?'空位':'open')}" data-action="seat" data-id="${n}" data-slot="${i}">${chairSvg(status)}</button>`}).join('')}</div></div>`}).join('')}</div><div class="seat-legend"><span class="seat-legend-item"><span class="mini-chair booked">${chairSvg('booked')}</span>${state.lang==='zh'?'已订':'Booked'}</span><span class="seat-legend-item"><span class="mini-chair mine">${chairSvg('mine')}</span>${state.lang==='zh'?'我的座位':'My seat'}</span><span class="seat-legend-item"><span class="mini-chair open">${chairSvg('open')}</span>${state.lang==='zh'?'空位':'Open'}</span></div></section><div class="detail-footer"><div class="footer-note">${t('cancel')}<br>${t('paid')}</div><button class="primary-btn" data-action="checkout" ${state.seat===null?'disabled':''}>${state.seat===null?(state.lang==='zh'?'先选择一个空位':'Choose an open seat'):`${state.lang==='zh'?'预订我的座位':'Reserve my seat'} · #${state.seat} · ${money(total())}`}</button></div></main>`}
function takenFor(slot){let group=state.tables.find(x=>x.id===state.currentTableId);if(group)return Array.isArray(group.seatNumbers)?group.seatNumbers:Array.from({length:group.filled},(_,i)=>i+1);return [[1,2,3,4,5],[1,2,3],[1,2,3,4,5,6]][slot]}
function slotLabel(slot){let group=state.tables.find(x=>x.id===state.currentTableId);if(group)return new Date(group.startsAt).toLocaleString(state.lang==='zh'?'zh-CN':'en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});return state.lang==='zh'?['周六 12:30','周六 18:30','周日 15:00'][slot]:['Saturday · 12:30 PM','Saturday · 6:30 PM','Sunday · 3:00 PM'][slot]}
function checkout(){let r=restaurants[state.restaurant], included=selectedMenuItems()[state.lang];let subtotal=foodPrice(),tax=Math.round(subtotal*.1025*100)/100,tip=Math.round(subtotal*.18*100)/100;return `<main class="page">${back()}<section class="hero"><p class="eyebrow">${t('payTitle')}</p><h1>${t('checkout')}</h1><p class="subhead">${t('paid')}</p></section><div class="checkout-grid"><div class="panel"><h2>${t('summary')}</h2><div class="summary-restaurant">${pair(r.en,r.zh)}</div><div class="summary-line"><span>${t('slot')}</span><b>${slotLabel(state.slot)}</b></div><div class="summary-line"><span>${t('seatNo')}</span><b>#${state.seat}</b></div><div class="summary-line"><span>${t('order')}</span><span>${included.map(item=>`<div style="text-align:right;margin-bottom:7px">${item}</div>`).join('')}</span></div><div class="cancel-note">${t('cancel')}</div></div><div class="panel"><h2>${t('details')}</h2><div class="summary-line"><span>${t('subtotal')}</span><b>${money(subtotal)}</b></div><div class="summary-line"><span>${t('tax')}</span><b>${money(tax)}</b></div><div class="summary-line"><span>${t('tip')}</span><b>${money(tip)}</b></div><div class="summary-line total-line"><span>${t('total')}</span><b>${money(total())}</b></div><p class="pay-note">${t('paid')}</p><button class="primary-btn" style="width:100%" data-action="pay">${t('pay')} · ${money(total())}</button></div></div></main>`}
function confirmation(){let b=state.bookings[0];return `<main class="page confirm"><div class="checkmark">✓</div><p class="eyebrow">${t('booked')}</p><h1 class="title">${t('confirmed')}</h1><div class="booking-code">${t('code')} · ${b.code}</div><div class="panel" style="text-align:left"><div class="summary-restaurant">${pair(b.restaurant,b.restaurantZh)}</div><div class="summary-line"><span>${t('time')}</span><b>${b.slot}</b></div><div class="summary-line"><span>${t('seatNo')}</span><b>#${b.seat}</b></div><div class="summary-line"><span>${t('order')}</span><b>${b.dishes}</b></div><div class="summary-line total-line"><span>${t('total')}</span><b>${money(b.total)}</b></div></div><button class="primary-btn" style="margin-top:18px" data-action="browse">${t('done')}</button> <button class="bookings-btn" style="margin-top:18px" data-action="bookings">${t('bookings')}</button></main>`}
function bookings(){let myTables=state.tables.filter(x=>x.userJoined||x.createdByMe||state.joinedTables.includes(x.id));return `<main class="page">${back()}<section class="hero"><p class="eyebrow">ALongTable</p><h1>${t('bookings')}</h1></section>${state.bookings.length?`<div class="section-row"><h2>${state.lang==='zh'?'已付款预订':'Prepaid bookings'}</h2></div><div class="bookings-list">${state.bookings.map(b=>`<article class="booking-card"><div><b>${pair(b.restaurant,b.restaurantZh)}</b><small>${b.code} · ${b.slot} · ${t('seatNo')} #${b.seat} · ${b.dishes}</small></div><span class="booking-price">${money(b.total)}</span></article>`).join('')}</div>`:''}${myTables.length?`<div class="section-row"><h2>${state.lang==='zh'?'我创建或加入的餐桌':'Tables I host or joined'}</h2></div><div class="table-feed">${myTables.map(tableCard).join('')}</div>`:''}${!state.bookings.length&&!myTables.length?`<div class="empty">${state.lang==='zh'?'已付款预订、创建或加入的餐桌会显示在这里。':'Your prepaid bookings and tables you host or join will appear here.'}</div>`:''}</main>`}
function refreshTableStatuses(){let changed=false,now=Date.now();for(const table of state.tables||[]){let start=Date.parse(table.startsAt);if(!Number.isFinite(start))continue;if(table.status==='open'&&now>=start-24*60*60*1000){table.status=table.filled>=table.minSeats?'confirmed':'cancelled';table.statusChangedAt=new Date(now).toISOString();changed=true}if((table.status==='confirmed'||table.status==='open')&&now>=start){table.status='completed';changed=true}}return changed}
function render(){let content=state.view==='onboarding'?onboarding():state.view==='discover'?discover():state.view==='createTable'?createTable():state.view==='browse'?browse():state.view==='detail'?details():state.view==='checkout'?checkout():state.view==='confirmation'?confirmation():bookings();let nav=state.view==='onboarding'?'':`<nav class="bottom-nav"><button class="${state.view==='discover'?'active':''}" data-action="discover">${state.lang==='zh'?'为你推荐':'For you'}</button><button class="${state.view==='browse'||state.view==='detail'?'active':''}" data-action="restaurantTab">${state.lang==='zh'?'餐厅':'Restaurants'}</button><button class="${state.view==='bookings'?'active':''}" data-action="bookings">${state.lang==='zh'?'我的预订':'My bookings'}</button></nav>`;root.innerHTML=header()+content+nav+(state.toast?`<div class="toast">${esc(state.toast)}</div>`:'');if(lastRenderedView!==state.view){window.scrollTo(0,0);lastRenderedView=state.view}}
function action(el){let a=el.dataset.action,id=el.dataset.id;if(a==='language'){state.lang=state.lang==='en'?'zh':'en'}else if(a==='openTheme'){let n=Number(id);state.selectedThemes=[n];state.theme=n;state.onboarded=true;state.view='discover'}else if(a==='onboardTheme'){let n=Number(id);state.selectedThemes=state.selectedThemes.includes(n)?state.selectedThemes.filter(x=>x!==n):[...state.selectedThemes,n]}else if(a==='finishOnboarding'){if(state.selectedThemes.length){state.onboarded=true;state.view='discover'}else state.toast=state.lang==='zh'?'至少选择一个主题':'Choose at least one theme'}else if(a==='editInterests'){state.view='onboarding'}else if(a==='discover'){state.view='discover'}else if(a==='back'){if(state.view==='checkout')state.view='detail';else if(state.view==='createTable')state.view='discover';else if(state.currentTableId){if(state.pendingHostTableId===state.currentTableId)state.tables=state.tables.filter(x=>x.id!==state.currentTableId);state.pendingHostTableId=null;state.currentTableId=null;state.view='discover'}else state.view='browse'}else if(a==='themeTab'){state.view=state.onboarded?'discover':'onboarding'}else if(a==='restaurantTab'){state.view='browse'}else if(a==='theme'){state.theme=Number(id);state.view='browse'}else if(a==='restaurant'){state.restaurant=Number(id);state.currentTableId=null;state.tier=2;state.slot=0;state.seat=null;state.view='detail'}else if(a==='browse'){state.view='browse'}else if(a==='bookings'){state.view='bookings'}else if(a==='tier'){state.tier=Number(id)}else if(a==='dish'){state.dishes[el.dataset.key]=Number(id)}else if(a==='slot'){state.slot=Number(id);state.seat=null}else if(a==='seat'){state.slot=Number(el.dataset.slot);state.seat=Number(id)}else if(a==='startCreate'){state.draft={restaurant:0,startDate:defaultDate(),time:'19:00',theme:state.selectedThemes[0]??0,minSeats:5,maxSeats:8};state.view='createTable'}else if(a==='joinTable'){let table=state.tables.find(x=>x.id===id);if(table&&['open','confirmed'].includes(table.status)&&table.filled<table.maxSeats&&!state.joinedTables.includes(id)&&!table.userJoined){state.currentTableId=table.id;state.restaurant=table.restaurant;state.tier=2;state.slot=0;state.seat=null;state.view='detail'}}else if(a==='createTable'){let d=state.draft,startAt=new Date(`${d.startDate}T${d.time}`),hours=(startAt.getTime()-Date.now())/3600000,min=Number(d.minSeats),max=Number(d.maxSeats);if(!Number.isFinite(startAt.getTime())||hours<48)state.toast=state.lang==='zh'?'餐桌必须至少提前 48 小时创建。':'Create a table at least 48 hours before it starts.';else if(min<2||max<min||max>8)state.toast=state.lang==='zh'?'请检查最低人数和最多人数。':'Check the minimum and maximum guest counts.';else{let newTable={id:'host-'+Date.now(),restaurant:Number(d.restaurant),theme:Number(d.theme),startsAt:startAt.toISOString(),filled:0,seatNumbers:[],minSeats:min,maxSeats:max,host:state.lang==='zh'?'你':'You',status:'draft',userJoined:false,createdByMe:true};state.tables.unshift(newTable);state.pendingHostTableId=newTable.id;state.currentTableId=newTable.id;state.restaurant=newTable.restaurant;state.tier=2;state.slot=0;state.seat=null;state.view='detail';state.toast=state.lang==='zh'?'选择套餐和座位，完成预付后餐桌将发布。':'Choose your menu and seat; prepay to publish the table.'}}else if(a==='checkout'){if(state.seat===null){state.toast=t('error');clearTimeout(timer);timer=setTimeout(()=>{state.toast='';render()},2200)}else state.view='checkout'}else if(a==='pay'){let r=restaurants[state.restaurant],codes=2481+state.bookingCount;let picked=selectedMenuItems()[state.lang].join(' + ');let slot=`${slotLabel(state.slot)}`;let b={code:'ALT-'+codes,restaurant:r.en,restaurantZh:r.zh,slot,seat:state.seat,dishes:picked,total:total()};state.bookings=[b,...state.bookings];state.bookingCount++;let group=state.tables.find(x=>x.id===state.currentTableId);if(group){if(!Array.isArray(group.seatNumbers))group.seatNumbers=Array.from({length:group.filled},(_,i)=>i+1);if(!group.seatNumbers.includes(state.seat))group.seatNumbers.push(state.seat);group.filled=group.seatNumbers.length;group.userJoined=true;if(group.status==='draft')group.status='open';state.joinedTables.push(group.id);if(state.pendingHostTableId===group.id)state.pendingHostTableId=null}state.view='confirmation'}save()}
root.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled||el.type==='radio')return;action(el)});root.addEventListener('change',e=>{let dish=e.target.closest('[data-dish]');if(dish){state.dishes[dish.dataset.dish]=Number(dish.value);save();return}let field=e.target.closest('[data-field]');if(field){state.draft[field.dataset.field]=field.value;write();return}let el=e.target.closest('[data-action="dish"]');if(el)action(el)});onBridge((event)=>{try{let next=event?.detail?.state??event?.state??bridge.getState?.();if(next&&typeof next==='object')state={...initial,...state,...next};refreshTableStatuses();render()}catch(_){}});refreshTableStatuses();render();setInterval(()=>{if(refreshTableStatuses()){write();render()}},60000);
})();
